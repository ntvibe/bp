name: Assemble asset bundle

on:
  push:
    paths:
      - ".github/workflows/assemble-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .tmp-assets/part*.txt | base64 --decode > motion-pack.zip
          echo "9f464a10b0296752845134e1bb0be474df1650daaf58fc05225895d7c09b21bd  motion-pack.zip" | sha256sum --check
          test "$(stat -c%s motion-pack.zip)" = "46248"

      - name: Remove staging files
        shell: bash
        run: |
          rm -rf .tmp-assets
          rm -f .github/workflows/assemble-assets.yml

      - name: Commit final archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add encrypted motion asset bundle"
          git push
