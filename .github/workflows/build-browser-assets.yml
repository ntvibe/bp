name: Build browser asset wrapper

on:
  push:
    paths:
      - ".github/workflows/build-browser-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build JS wrapper
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'window.MOTION_PACK_B64="'
            base64 -w0 motion-pack.zip
            printf '";\n'
          } > motion-pack.js

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/build-browser-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add browser-loadable encrypted asset wrapper"
          git push
