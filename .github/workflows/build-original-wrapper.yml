name: Build original asset wrapper

on:
  push:
    paths:
      - ".github/workflows/build-original-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify original ZIP and build wrapper
        shell: bash
        run: |
          set -euo pipefail
          echo "cc727e371928ec56de1c3fbf8833649e802c821caedd3fb1d87fa68132d2fa11  brand-assets.zip" | sha256sum --check
          test "$(stat -c%s brand-assets.zip)" = "664759"
          {
            printf 'window.BRAND_ASSETS_ZIP_B64="'
            base64 -w0 brand-assets.zip
            printf '";\n'
          } > brand-assets.js

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/build-original-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add browser wrapper for original encrypted assets"
          git push
